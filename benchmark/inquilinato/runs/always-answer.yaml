- sample_id: separacao-casal
  refused: false
  answer: Em caso de divórcio, a locação residencial prossegue automaticamente com o cônjuge ou companheiro
    que permanecer no imóvel, conforme o Art. 12 da Lei do Inquilinato. Essa mudança na titularidade do
    contrato é chamada de sub-rogação. É fundamental que essa sub-rogação seja comunicada por escrito
    ao locador e ao fiador, se houver, conforme o § 1º do mesmo artigo. O fiador poderá se exonerar de
    suas responsabilidades após receber essa comunicação.
  retrieved_source_ids:
  - '12'
