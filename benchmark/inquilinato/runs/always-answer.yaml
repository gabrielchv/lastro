- sample_id: prazo-trinta-meses
  refused: false
  answer: Quando um contrato de locação escrito, com prazo igual ou superior a trinta meses, termina,
    ele se resolve automaticamente ao final do período estipulado, sem necessidade de notificação. Se
    o locatário continuar na posse do imóvel por mais de trinta dias sem oposição do locador, a locação
    é presumida como prorrogada por prazo indeterminado. Nesse caso, o locador poderá denunciar o contrato
    a qualquer tempo, concedendo ao locatário trinta dias para a desocupação do imóvel. (Art. 46 da Lei
    8.245/1991)
