- sample_id: direito-preferencia
  refused: false
  answer: 'Sim, o locatário tem direito de preferência para adquirir o imóvel alugado, em igualdade de
    condições com terceiros, conforme o Art. 27 da Lei do Inquilinato.


    O locador deve notificar o locatário sobre o negócio, informando todas as condições, como preço, forma
    de pagamento e existência de ônus reais. Essa comunicação pode ser judicial, extrajudicial ou por
    outro meio de ciência inequívoca. O locatário terá o prazo de trinta dias para manifestar sua aceitação
    integral à proposta.'
