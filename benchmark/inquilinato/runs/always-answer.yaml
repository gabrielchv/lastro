- sample_id: pagamento-antecipado
  refused: false
  answer: 'Não, o locador geralmente não pode exigir o pagamento antecipado do aluguel, sendo inclusive
    uma contravenção penal (Art. 20 e Art. 43, III).


    Existem duas exceções a essa regra:

    1.  Quando a locação não possui nenhuma modalidade de garantia, o locador poderá exigir o pagamento
    do aluguel e encargos até o sexto dia útil do mês vincendo (Art. 42).

    2.  Em contratos de locação para temporada (Art. 20 e Art. 43, III).


    Fora dessas situações específicas, a cobrança antecipada do aluguel é proibida.'
  retrieved_source_ids:
  - '20'
  - '49'
  - '42'
  - '43'
  - '25'
  citations:
  - source_id: Art. 20
    quote: Salvo as hipóteses do art. 42 e da locação para temporada, o locador não poderá exigir o pagamento
      antecipado do aluguel.
  - source_id: Art. 43
    quote: 'Constitui contravenção penal, punível com prisão simples de cinco dias a seis meses ou multa
      de três a doze meses do valor do último aluguel atualizado, revertida em favor do locatário: III
      - cobrar antecipadamente o aluguel, salvo a hipótese do art. 42 e da locação para temporada.'
  - source_id: Art. 42
    quote: Não estando a locação garantida por qualquer das modalidades, o locador poderá exigir do locatário
      o pagamento do aluguel e encargos até o sexto dia útil do mês vincendo.
  - source_id: Art. 20
    quote: Salvo as hipóteses do art. 42 e da locação para temporada, o locador não poderá exigir o pagamento
      antecipado do aluguel.
  - source_id: Art. 43
    quote: 'Constitui contravenção penal, punível com prisão simples de cinco dias a seis meses ou multa
      de três a doze meses do valor do último aluguel atualizado, revertida em favor do locatário: III
      - cobrar antecipadamente o aluguel, salvo a hipótese do art. 42 e da locação para temporada.'
  claims:
  - O locador geralmente não pode exigir o pagamento antecipado do aluguel.
  - A exigência antecipada do aluguel constitui contravenção penal.
  - A proibição geral está prevista no artigo 20 da lei de locações.
  - A contravenção penal está prevista no artigo 43, inciso III, da lei de locações.
  - Uma exceção à proibição ocorre quando a locação não possui nenhuma modalidade de garantia.
  - Nesse caso, o locador pode exigir o pagamento do aluguel e encargos até o sexto dia útil do mês vincendo.
  - Esta exceção está prevista no artigo 42 da lei de locações.
  - Outra exceção é aplicável aos contratos de locação para temporada.
