- sample_id: morte-locador
  refused: false
  answer: De acordo com o Art. 10 da Lei do Inquilinato (Lei 8.245/1991), se o locador falecer, o contrato
    de locação é transmitido automaticamente aos seus herdeiros. Isso significa que a locação prossegue
    normalmente, e os herdeiros assumem a posição de locadores. O locatário continua com seus direitos
    e obrigações, pagando o aluguel aos novos proprietários do imóvel.
  retrieved_source_ids:
  - '10'
  - '11'
  - '12'
  - '40'
  - '50'
  citations:
  - source_id: Art. 10
    quote: Morrendo o locador, a locação transmite - se aos herdeiros.
  claims:
  - Em caso de falecimento do locador, o contrato de locação transmite-se aos seus herdeiros.
  - A locação prossegue normalmente.
  - Os herdeiros assumem a posição de locadores.
  - O locatário mantém seus direitos e obrigações.
  - O locatário deve pagar o aluguel aos novos proprietários do imóvel.
- sample_id: morte-locatario
  refused: false
  answer: 'Em caso de falecimento do locatário, o contrato de locação é assumido de formas diferentes,
    dependendo da finalidade do imóvel.


    Para locações residenciais, o cônjuge sobrevivente ou companheiro assume os direitos e obrigações,
    e, sucessivamente, os herdeiros necessários e as pessoas que viviam na dependência econômica do falecido,
    desde que residentes no imóvel.


    Já nas locações não residenciais, o espólio e, se houver, o sucessor no negócio, ficam sub-rogados
    no contrato.


    É importante que a sub-rogação seja comunicada por escrito ao locador e ao fiador, se houver.'
  retrieved_source_ids:
  - '11'
  - '10'
  - '12'
  - '40'
  - '51'
  citations:
  - source_id: Art. 11
    quote: 'Morrendo o locatário, ficarão sub - rogados nos seus direitos e obrigações: I - nas locações
      com finalidade residencial, o cônjuge sobrevivente ou o companheiro e, sucessivamente, os herdeiros
      necessários e as pessoas que viviam na dependência econômica do de cujus , desde que residentes
      no imóvel; II - nas locações com finalidade não residencial, o espólio e, se for o caso, seu sucessor
      no negócio.'
  - source_id: Art. 11
    quote: nas locações com finalidade residencial, o cônjuge sobrevivente ou o companheiro e, sucessivamente,
      os herdeiros necessários e as pessoas que viviam na dependência econômica do de cujus , desde que
      residentes no imóvel
  - source_id: Art. 11
    quote: nas locações com finalidade não residencial, o espólio e, se for o caso, seu sucessor no negócio.
  - source_id: Art. 12
    quote: Nas hipóteses previstas neste artigo e no art. 11, a sub-rogação será comunicada por escrito
      ao locador e ao fiador, se esta for a modalidade de garantia locatícia.
  claims:
  - O falecimento do locatário implica a assunção do contrato de locação.
  - A forma de assunção do contrato de locação após o falecimento do locatário depende da finalidade do
    imóvel.
  - Em locações residenciais, o cônjuge sobrevivente ou companheiro assume os direitos e obrigações do
    contrato de locação.
  - Em locações residenciais, sucessivamente, os herdeiros necessários assumem os direitos e obrigações
    do contrato de locação.
  - Em locações residenciais, sucessivamente, as pessoas que viviam na dependência econômica do falecido
    assumem os direitos e obrigações do contrato de locação.
  - A assunção do contrato de locação por dependentes econômicos exige que estes fossem residentes no
    imóvel.
  - Em locações não residenciais, o espólio fica sub-rogado no contrato de locação.
  - Em locações não residenciais, o sucessor no negócio fica sub-rogado no contrato de locação, se houver.
  - A sub-rogação deve ser comunicada por escrito ao locador.
  - A sub-rogação deve ser comunicada por escrito ao fiador, se houver.
- sample_id: crime-locacao
  refused: false
  answer: 'A Lei do Inquilinato considera crime, por exemplo, a recusa do locador em fornecer recibo discriminado
    de aluguel e encargos em habitações coletivas multifamiliares. Também é crime o retomante não usar
    o imóvel para o fim declarado ou não o fizer pelo prazo mínimo de um ano após a entrega, ou não iniciar
    demolição/reparação urgente no prazo.


    Além disso, constitui contravenção penal exigir quantia ou valor além do aluguel e encargos permitidos,
    ou mais de uma modalidade de garantia no mesmo contrato de locação. Cobrar aluguel antecipadamente,
    salvo exceções como locação sem garantia ou para temporada, também é uma contravenção.'
