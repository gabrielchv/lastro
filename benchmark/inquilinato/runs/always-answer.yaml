  claims:
  - A liminar para desocupação em 15 dias pode ser concedida em ações de despejo.
  - A concessão da liminar exige que o locador preste caução.
  - A caução deve ser equivalente a três meses de aluguel.
  - A liminar é cabível em caso de descumprimento de mútuo acordo de desocupação.
  - A liminar é cabível no término de locação para temporada.
  - A liminar é cabível no término de locação não residencial, se a ação for proposta em até 30 dias do
    fim do contrato.
  - A liminar é cabível em caso de rescisão de contrato de trabalho.
  - A liminar é cabível em caso de morte do locatário sem sucessor.
  - A liminar é cabível em caso de permanência de sublocatário após o fim da locação principal.
  - A liminar é cabível em caso de necessidade de reparos urgentes no imóvel.
  - A liminar é cabível no término do prazo notificatório sem nova garantia.
  - A liminar é cabível na falta de pagamento de aluguel quando o contrato não possui garantia.
