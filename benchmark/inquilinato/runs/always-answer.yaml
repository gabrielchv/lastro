  - '69'
  - '19'
  - '85'
  - '68'
  citations:
  - source_id: Art. 18
    quote: É lícito às partes fixar, de comum acordo, novo valor para o aluguel, bem como inserir ou modificar
      cláusula de reajuste.
  - source_id: Art. 19
    quote: Não havendo acordo, o locador ou locatário, após três anos de vigência do contrato ou do acordo
      anteriormente realizado, poderão pedir revisão judicial do aluguel, a fim de ajustá - lo ao preço
      de mercado.
  - source_id: Art. 85
    quote: 'Nas locações residenciais, é livre a convenção do aluguel quanto a preço, periodicidade e
