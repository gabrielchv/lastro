- sample_id: rescisao-antecipada
  refused: false
  answer: 'Sim, você pode sair do contrato de aluguel antes do prazo combinado. No entanto, você deverá
    pagar a multa pactuada, que será proporcional ao período de cumprimento do contrato.


    Você será dispensado da multa se a devolução do imóvel ocorrer devido a uma transferência de trabalho
    (pública ou privada) para outra localidade. Para isso, é necessário notificar o locador por escrito
    com, no mínimo, trinta dias de antecedência.'
