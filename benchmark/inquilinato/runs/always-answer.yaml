  - O locador não pode recusar a renovação do contrato alegando que transferirá seu próprio fundo de comércio,
    conforme o Art. 52, § 2º da Lei do Inquilinato.
- sample_id: despejo-liminar
  refused: false
  answer: 'A liminar para desocupação em 15 dias pode ser concedida em ações de despejo, desde que o locador
    preste caução equivalente a três meses de aluguel. Isso ocorre em situações como o descumprimento
    de mútuo acordo de desocupação, término de locação para temporada ou não residencial (com ação em
    até 30 dias), e rescisão de contrato de trabalho.


    Também é cabível em casos de morte do locatário sem sucessor, permanência de sublocatário após o fim
    da locação principal, ou necessidade de reparos urgentes no imóvel. Outras hipóteses incluem o término
    do prazo notificatório sem nova garantia ou a falta de pagamento de aluguel quando o contrato não
    possui garantia.'
