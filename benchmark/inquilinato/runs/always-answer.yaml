- sample_id: renovacao-comercial
  refused: false
  answer: 'Sim, um contrato de aluguel comercial pode ter direito à renovação, conforme o Art. 51 da Lei
    do Inquilinato. Para isso, o contrato deve ser escrito e com prazo determinado.


    Além disso, o prazo mínimo do contrato ou a soma dos prazos ininterruptos deve ser de cinco anos,
    e o locatário precisa estar explorando o mesmo ramo de comércio por, no mínimo, três anos ininterruptos.
    O direito à renovação também se estende a indústrias e sociedades civis com fim lucrativo.'
  retrieved_source_ids:
  - '51'
  - '52'
  - '72'
  - '50'
  - '19'
  citations:
  - source_id: Art. 51
    quote: 'Nas locações de imóveis destinados ao comércio, o locatário terá direito a renovação do contrato,
      por igual prazo, desde que, cumulativamente:'
  - source_id: Art. 51, I
    quote: o contrato a renovar tenha sido celebrado por escrito e com prazo determinado;
  - source_id: Art. 51, II
    quote: o prazo mínimo do contrato a renovar ou a soma dos prazos ininterruptos dos contratos escritos
      seja de cinco anos;
  - source_id: Art. 51, III
    quote: o locatário esteja explorando seu comércio, no mesmo ramo, pelo prazo mínimo e ininterrupto
      de três anos.
  - source_id: Art. 51, § 4º
    quote: O direito a renovação do contrato estende - se às locações celebradas por indústrias e sociedades
      civis com fim lucrativo, regularmente constituídas, desde que ocorrentes os pressupostos previstos
      neste artigo.
  claims:
  - Um contrato de aluguel comercial pode ter direito à renovação.
  - O direito à renovação está previsto no Art. 51 da Lei do Inquilinato.
  - O contrato deve ser escrito para ter direito à renovação.
  - O contrato deve ter prazo determinado para ter direito à renovação.
  - O prazo mínimo do contrato deve ser de cinco anos para ter direito à renovação.
  - A soma dos prazos ininterruptos do contrato deve ser de cinco anos para ter direito à renovação.
  - O locatário deve estar explorando o mesmo ramo de comércio por, no mínimo, três anos ininterruptos.
  - O direito à renovação se estende a indústrias.
  - O direito à renovação se estende a sociedades civis com fim lucrativo.
- sample_id: shopping-center
  refused: false
  answer: Na locação de loja em shopping center, prevalecem as condições livremente pactuadas no contrato,
    conforme o Art. 54 da Lei do Inquilinato. O empreendedor não pode cobrar do lojista despesas como
    obras que modifiquem o projeto original, paisagismo de áreas comuns, ou certas despesas extraordinárias
    de condomínio (Art. 54, § 1º). As despesas cobradas devem ser previstas em orçamento, e o locatário
    pode exigir sua comprovação a cada sessenta dias (Art. 54, § 2º). Além disso, o locador não pode recusar
    a renovação do contrato alegando que usará o imóvel para si ou para transferir seu próprio fundo de
    comércio (Art. 52, § 2º).
