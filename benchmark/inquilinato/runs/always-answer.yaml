  answer: 'Não, o locatário não pode sublocar o imóvel sem autorização. De acordo com o Art. 13 da Lei
    do Inquilinato, a sublocação, total ou parcial, depende do consentimento prévio e escrito do locador.


    Caso o locatário notifique o locador por escrito sobre a intenção de sublocar, o locador terá 30 dias
    para manifestar formalmente sua oposição. A simples demora do locador em se manifestar não presume
    o consentimento.'
  retrieved_source_ids:
  - '13'
  - '30'
  - '16'
  - '21'
  - '15'
  citations:
  - source_id: Art. 13
    quote: A cessão da locação, a sublocação e o empréstimo do imóvel, total ou parcialmente, dependem
      do consentimento prévio e escrito do locador.
  - source_id: Art. 13
    quote: Desde que notificado por escrito pelo locatário, de ocorrência de uma das hipóteses deste artigo,
      o locador terá o prazo de trinta dias para manifestar formalmente a sua oposição.
  - source_id: Art. 13
    quote: Não se presume o consentimento pela simples demora do locador em manifestar formalmente a sua
      oposição.
  claims:
  - O locatário não pode sublocar o imóvel sem autorização.
  - A sublocação, total ou parcial, depende do consentimento prévio e escrito do locador.
  - O Art. 13 da Lei do Inquilinato estabelece a necessidade de consentimento prévio e escrito do locador
    para a sublocação.
  - Se o locatário notificar o locador por escrito sobre a intenção de sublocar, o locador terá 30 dias
    para manifestar formalmente sua oposição.
  - A simples demora do locador em se manifestar não presume o consentimento para a sublocação.
- sample_id: reajuste-aluguel
  refused: false
  answer: O reajuste do aluguel pode ser feito de comum acordo entre as partes, que podem fixar um novo
    valor ou modificar a cláusula de reajuste, conforme o Art. 18. Caso não haja acordo, após três anos
    de vigência do contrato, locador ou locatário podem pedir uma revisão judicial para ajustar o aluguel
    ao preço de mercado, conforme o Art. 19. Nas locações residenciais, a escolha do indexador e a periodicidade
    do reajuste são livres, mas é vedada a vinculação ao salário mínimo, variação cambial ou moeda estrangeira,
    conforme o Art. 85. Em caso de revisão judicial, um aluguel provisório pode ser fixado e a sentença
    retroage à citação, conforme o Art. 68 e 69.
