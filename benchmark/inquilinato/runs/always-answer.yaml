- sample_id: obrigacoes-locatario
  refused: false
  answer: 'Durante a locação, o locatário é obrigado a pagar pontualmente o aluguel e os encargos, usar
    o imóvel conforme o destino e tratá-lo com cuidado, e restituí-lo no estado em que o recebeu, salvo
    deteriorações de uso normal (Art. 23, I, II, III).


    Também deve informar o locador sobre danos ou defeitos de sua responsabilidade e realizar reparos
    imediatos de danos causados por si ou seus dependentes (Art. 23, IV, V). É sua responsabilidade pagar
    as despesas de consumo (água, luz, gás, telefone) e as despesas ordinárias de condomínio (Art. 23,
    VIII, XII). Além disso, não pode modificar o imóvel sem consentimento prévio e por escrito do locador
    (Art. 23, VI).'
  retrieved_source_ids:
  - '23'
  - '22'
  - '41'
  - '26'
  - '42'
  citations:
  - source_id: Art. 23, I
    quote: pagar pontualmente o aluguel e os encargos da locação, legal ou contratualmente exigíveis,
      no prazo estipulado ou, em sua falta, até o sexto dia útil do mês seguinte ao vencido, no imóvel
      locado, quando outro local não tiver sido indicado no contrato;
  - source_id: Art. 23, II
    quote: servir - se do imóvel para o uso convencionado ou presumido, compatível com a natureza deste
      e com o fim a que se destina, devendo tratá - lo com o mesmo cuidado como se fosse seu;
  - source_id: Art. 23, III
    quote: restituir o imóvel, finda a locação, no estado em que o recebeu, salvo as deteriorações decorrentes
      do seu uso normal;
  - source_id: Art. 23, IV
    quote: levar imediatamente ao conhecimento do locador o surgimento de qualquer dano ou defeito cuja
      reparação a este incumba, bem como as eventuais turbações de terceiros;
  - source_id: Art. 23, V
    quote: realizar a imediata reparação dos danos verificados no imóvel, ou nas suas instalações, provocadas
      por si, seus dependentes, familiares, visitantes ou prepostos;
  - source_id: Art. 23, VIII
    quote: pagar as despesas de telefone e de consumo de força, luz e gás, água e esgoto;
  - source_id: Art. 23, XII
    quote: pagar as despesas ordinárias de condomínio.
  - source_id: Art. 23, VI
    quote: não modificar a forma interna ou externa do imóvel sem o consentimento prévio e por escrito
      do locador;
  claims:
  - O locatário deve pagar pontualmente o aluguel e os encargos da locação.
  - O locatário deve usar o imóvel conforme o destino convencionado ou presumido.
  - O locatário deve tratar o imóvel com o mesmo cuidado como se fosse seu.
  - O locatário deve restituir o imóvel no estado em que o recebeu, ressalvadas as deteriorações decorrentes
    do uso normal.
  - O locatário deve informar o locador sobre qualquer dano ou defeito cuja reparação seja de sua responsabilidade.
  - O locatário deve realizar os reparos imediatos dos danos causados por si, seus dependentes ou visitantes.
  - O locatário deve pagar as despesas de consumo de água, luz, gás e telefone.
  - O locatário deve pagar as despesas ordinárias de condomínio.
  - O locatário não pode modificar a forma interna ou externa do imóvel sem o consentimento prévio e por
    escrito do locador.
- sample_id: obrigacoes-locador
