  - '12'
  citations:
  - source_id: Art. 8
    quote: Se o imóvel for alienado durante a locação, o adquirente poderá denunciar o contrato, com o
      prazo de noventa dias para a desocupação
  - source_id: Art. 8
    quote: salvo se a locação for por tempo determinado e o contrato contiver cláusula de vigência em
      caso de alienação e estiver averbado junto à matrícula do imóvel.
  - source_id: Art. 8
    quote: A denúncia deverá ser exercitada no prazo de noventa dias contados do registro da venda ou
      do compromisso, presumindo - se, após esse prazo, a concordância na manutenção da locação.
  - source_id: Art. 27
    quote: No caso de venda, promessa de venda, cessão ou promessa de cessão de direitos ou dação em pagamento,
      o locatário tem preferência para adquirir o imóvel locado, em igualdade de condições com terceiros
  claims:
  - Se o imóvel for vendido durante a locação, o novo proprietário poderá denunciar o contrato.
  - O novo proprietário deve conceder ao inquilino 90 dias para desocupar o imóvel.
  - A denúncia do contrato pelo novo proprietário não será possível se a locação for por tempo determinado,
    o contrato contiver cláusula de vigência em caso de alienação e estiver averbado na matrícula do imóvel.
  - O adquirente deve exercer o direito de denúncia em até 90 dias do registro da venda.
  - Caso o adquirente não exerça o direito de denúncia em até 90 dias do registro da venda, presume-se
    a concordância com a manutenção da locação.
  - O locatário tem direito de preferência para adquirir o imóvel.
  - O direito de preferência do locatário é exercido em igualdade de condições com terceiros.
- sample_id: clausulas-nulas
  refused: false
  answer: 'São nulas de pleno direito as cláusulas do contrato de locação que visem a elidir os objetivos
    da Lei do Inquilinato. Isso inclui, notadamente, as que proíbem a prorrogação ou afastam o direito
    à renovação do contrato, ou que imponham obrigações pecuniárias para tais fins, conforme o Art. 45.


    Também é nula a cláusula que exige mais de uma modalidade de garantia num mesmo contrato de locação,
    como caução e fiança simultaneamente, conforme o Art. 37, parágrafo único. A exigência de múltiplas
    garantias, inclusive, constitui contravenção penal (Art. 43, II).'
  retrieved_source_ids:
  - '45'
  - '37'
  - '54'
  - '43'
  - '4'
  citations:
  - source_id: Art. 45
    quote: São nulas de pleno direito as cláusulas do contrato de locação que visem a elidir os objetivos
      da presente lei, notadamente as que proíbam a prorrogação prevista no art. 47, ou que afastem o
      direito à renovação, na hipótese do art. 51, ou que imponham obrigações pecuniárias para tanto.
  - source_id: Art. 37, Parágrafo único
    quote: É vedada, sob pena de nulidade, mais de uma das modalidades de garantia num mesmo contrato
      de locação.
  - source_id: Art. 43, II
    quote: exigir, por motivo de locação ou sublocação, mais de uma modalidade de garantia num mesmo contrato
      de locação;
  claims:
  - São nulas de pleno direito as cláusulas do contrato de locação que visem a elidir os objetivos da
    Lei do Inquilinato.
  - Cláusulas que proíbem a prorrogação do contrato de locação são nulas de pleno direito, conforme o
    Art. 45 da Lei do Inquilinato.
  - Cláusulas que afastam o direito à renovação do contrato de locação são nulas de pleno direito, conforme
    o Art. 45 da Lei do Inquilinato.
  - Cláusulas que impõem obrigações pecuniárias para a prorrogação ou renovação do contrato de locação
    são nulas de pleno direito, conforme o Art. 45 da Lei do Inquilinato.
  - É nula a cláusula que exige mais de uma modalidade de garantia num mesmo contrato de locação, conforme
    o Art. 37, parágrafo único da Lei do Inquilinato.
  - A exigência de múltiplas garantias em um contrato de locação constitui contravenção penal, conforme
    o Art. 43, II da Lei do Inquilinato.
