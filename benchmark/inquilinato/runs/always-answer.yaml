- sample_id: fora-escopo-imposto
  refused: false
  answer: 'A Lei do Inquilinato (Lei 8.245/1991), com base nos artigos fornecidos, não detalha o procedimento
    para declarar imposto de renda.


    Os artigos tratam de temas como o registro de contratos de locação, requisitos para ações renovatórias,
    aspectos processuais de ações locatícias e a impenhorabilidade do bem de família em fiança de locação.


    Para informações sobre como declarar imposto de renda, você deve consultar a legislação específica
    da Receita Federal do Brasil.'
  retrieved_source_ids:
  - '81'
  - '71'
  - '58'
  - '82'
  - '67'
  citations:
  - source_id: Art. 81
    quote: 16) do contrato de locação, para os fins de exercício de direito de preferência." "Art. 169.
      ............................................................. ..............................................................................
      III - o registro previsto no n° 3 do inciso I do art. 167, e a averbação prevista no n° 16 do inciso
      II do art. 167 serão efetuados no cartório onde o imóvel esteja matriculado mediante apresentação
      de qualquer das vias do contrato, assinado pelas partes e subscrito por duas testemunhas, bastando
      a coincidência entre o nome de um dos proprietários e o locador."
  - source_id: Art. 71
    quote: 'Art. 71. Além dos demais requisitos exigidos no art. 282 do Código de Processo Civil, a petição
      inicial da ação renovatória deverá ser instruída com: I - prova do preenchimento dos requisitos
      dos incisos I, II e III do art. 51; II - prova do exato cumprimento do contrato em curso; III -
      prova da quitação dos impostos e taxas que incidiram sobre o imóvel e cujo pagamento lhe incumbia;
      IV - indicação clara e precisa das condições oferecidas para a renovação da locação; V – indicação
      do fiador quando houver no contrato a renovar e, quando não for o mesmo, com indicação do nome ou
      denominação completa, número de sua inscrição no Ministério da Fazenda, endereço e, tratando-se
      de pessoa natural, a nacionalidade, o estado civil, a profissão e o número da carteira de identidade,
      comprovando, desde logo, mesmo que não haja alteração do fiador, a atual idoneidade financeira;
      (Redação dada pela Lei nº 12.112, de 2009) VI - prova de que o fiador do contrato ou o que o substituir
      na renovação aceita os encargos da fiança, autorizado por seu cônjuge, se casado for; VII - prova,
      quando for o caso, de ser cessionário ou sucessor, em virtude de título oponível ao proprietário.
      Parágrafo único. Proposta a ação pelo sublocatário do imóvel ou de parte dele, serão citados o sublocador
      e o locador, como litisconsortes, salvo se, em virtude de locação originária ou renovada, o sublocador
      dispuser de prazo que admita renovar a sublocação; na primeira hipótese, procedente a ação, o proprietário
      ficará diretamente obrigado à renovação.'
  - source_id: Art. 58
    quote: 'Art. 58. Ressalvados os casos previstos no parágrafo único do art. 1º, nas ações de despejo,
      consignação em pagamento de aluguel e acessório da locação, revisionais de aluguel e renovatórias
      de locação, observar - se - á o seguinte: I - os processos tramitam durante as férias forenses e
      não se suspendem pela superveniência delas; II - é competente para conhecer e julgar tais ações
      o foro do lugar da situação do imóvel, salvo se outro houver sido eleito no contrato; III - o valor
      da causa corresponderá a doze meses de aluguel, ou, na hipótese do inciso II do art. 47, a três
      salários vigentes por ocasião do ajuizamento; IV - desde que autorizado no contrato, a citação,
      intimação ou notificação far - se - á mediante correspondência com aviso de recebimento, ou, tratando
      - se de pessoa jurídica ou firma individual, também mediante telex ou fac-símile , ou, ainda, sendo
      necessário, pelas demais formas previstas no Código de Processo Civil; V - os recursos interpostos
      contra as sentenças terão efeito somente devolutivo.'
  - source_id: Art. 67
    quote: 'Art. 67. Na ação que objetivar o pagamento dos aluguéis e acessórios da locação mediante consignação,
      será observado o seguinte: I - a petição inicial, além dos requisitos exigidos pelo art. 282 do
      Código de Processo Civil, deverá especificar os aluguéis e acessórios da locação com indicação dos
      respectivos valores; II - determinada a citação do réu, o autor será intimado a, no prazo de vinte
      e quatro horas, efetuar o depósito judicial da importância indicada na petição inicial, sob pena
      de ser extinto o processo; III - o pedido envolverá a quitação das obrigações que vencerem durante
      a tramitação do feito e até ser prolatada a sentença de primeira instância, devendo o autor promover
      os depósitos nos respectivos vencimentos; IV - não sendo oferecida a contestação, ou se o locador
      receber os valores depositados, o juiz acolherá o pedido, declarando quitadas as obrigações, condenando
      o réu ao pagamento das custas e honorários de vinte por cento do valor dos depósitos; V - a contestação
      do locador, além da defesa de direito que possa caber, ficará adstrita, quanto à matéria de fato,
      a: a) não ter havido recusa ou mora em receber a quantia devida; b) ter sido justa a recusa; c)
      não ter sido efetuado o depósito no prazo ou no lugar do pagamento; d} não ter sido o depósito integral;
      VI - além de contestar, o réu poderá, em reconvenção, pedir o despejo e a cobrança dos valores objeto
      da consignatória ou da diferença do depósito inicial, na hipótese de ter sido alegado não ser o
      mesmo integral; VII - o autor poderá complementar o depósito inicial, no prazo de cinco dias contados
      da ciência do oferecimento da resposta, com acréscimo de dez por cento sobre o valor da diferença.
      Se tal ocorrer, o juiz declarará quitadas as obrigações, elidindo a rescisão da locação, mas imporá
      ao autor-reconvindo a responsabilidade pelas custas e honorários advocatícios de vinte por cento
      sobre o valor dos depósitos; VIII - havendo, na reconvenção, cumulação dos pedidos de rescisão da
      locação e cobrança dos valores objeto da consignatória, a execução desta somente poderá ter início
      após obtida a desocupação do imóvel, caso ambos tenham sido acolhidos. Parágrafo único. O réu poderá
      levantar a qualquer momento as importâncias depositadas sobre as quais não penda controvérsia.'
  - source_id: Art. 82
    quote: 'Art. 82. O art. 3° da Lei n° 8.009, de 29 de março de 1990, passa a vigorar acrescido do seguinte
      inciso VII: "Art. 3° ................................................................. .............................................................................
      VII - por obrigação decorrente de fiança concedida em contrato de locação."'
