  - '3'
  - '4'
  - '10'
  citations:
  - source_id: Art. 12
    quote: Em casos de separação de fato, separação judicial, divórcio ou dissolução da união estável,
      a locação residencial prosseguirá automaticamente com o cônjuge ou companheiro que permanecer no
      imóvel.
  - source_id: Art. 12, § 1º
    quote: Nas hipóteses previstas neste artigo e no art. 11, a sub-rogação será comunicada por escrito
      ao locador e ao fiador, se esta for a modalidade de garantia locatícia.
  - source_id: Art. 12, § 2º
    quote: O fiador poderá exonerar-se das suas responsabilidades no prazo de 30 (trinta) dias contado
      do recebimento da comunicação oferecida pelo sub-rogado, ficando responsável pelos efeitos da fiança
      durante 120 (cento e vinte) dias após a notificação ao locador.
  claims:
  - A locação residencial prossegue automaticamente com o cônjuge ou companheiro que permanecer no imóvel
    em caso de divórcio, conforme o Art. 12 da Lei do Inquilinato.
  - A mudança na titularidade do contrato é denominada sub-rogação.
  - A sub-rogação deve ser comunicada por escrito ao locador e ao fiador, se houver, conforme o § 1º do
    Art. 12 da Lei do Inquilinato.
  - O fiador poderá se exonerar de suas responsabilidades após receber a comunicação da sub-rogação.
