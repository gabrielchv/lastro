- sample_id: garantia-prorrogacao
  refused: false
  answer: 'Sim, a fiança geralmente continua valendo mesmo após a prorrogação do contrato de locação por
    prazo indeterminado, estendendo-se até a efetiva devolução do imóvel, conforme o Art. 39 da Lei do
    Inquilinato. Isso ocorre salvo se houver disposição contratual em contrário.


    Contudo, em caso de prorrogação por prazo indeterminado, o locador pode exigir um novo fiador ou a
    substituição da garantia (Art. 40, V). O fiador também pode se exonerar da fiança, ficando responsável
    por 120 dias após notificar o locador (Art. 40, X).'
