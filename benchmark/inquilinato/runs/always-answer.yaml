  - Se o locatário continuar na posse do imóvel por mais de trinta dias sem oposição do locador, a locação
    é presumida como prorrogada por prazo indeterminado.
  - Nesse caso, o locador poderá denunciar o contrato a qualquer tempo.
  - O locador deve conceder ao locatário trinta dias para a desocupação do imóvel.
