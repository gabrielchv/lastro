- sample_id: benfeitorias
  refused: false
  answer: 'De acordo com o Art. 35 da Lei do Inquilinato, as benfeitorias necessárias introduzidas pelo
    locatário serão indenizáveis pelo locador, mesmo que não tenham sido autorizadas.


    Isso significa que, em regra, o locador é quem paga por essas melhorias. Contudo, essa regra pode
    ser alterada se houver uma disposição contratual expressa em contrário. Além disso, o locatário tem
    direito de retenção do imóvel até ser indenizado.'
