- sample_id: troca-fiador
  refused: false
  answer: O locador pode exigir a substituição do fiador em diversas situações, conforme o Art. 40 da
    Lei do Inquilinato. Isso inclui casos como a morte, ausência, interdição, falência ou recuperação
    judicial do fiador. Também é possível exigir nova garantia se o fiador alienar seus bens, mudar de
    residência sem avisar, ou se a locação for prorrogada por prazo indeterminado e a fiança era por prazo
    certo. O locador pode notificar o locatário para apresentar nova garantia em 30 dias, sob pena de
    desfazimento da locação.
