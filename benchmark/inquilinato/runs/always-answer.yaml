  - É vedada a vinculação do reajuste à variação cambial nas locações residenciais, conforme o Art. 85.
  - É vedada a vinculação do reajuste à moeda estrangeira nas locações residenciais, conforme o Art. 85.
  - Em caso de revisão judicial, um aluguel provisório pode ser fixado, conforme o Art. 68.
  - A sentença de revisão judicial retroage à citação, conforme o Art. 69.
- sample_id: venda-durante-locacao
  refused: false
  answer: Se o imóvel for vendido durante a locação, o novo proprietário poderá denunciar o contrato,
    concedendo ao inquilino 90 dias para desocupar o imóvel. Contudo, essa denúncia não será possível
    se a locação for por tempo determinado, o contrato contiver cláusula de vigência em caso de alienação
    e estiver averbado na matrícula do imóvel. O adquirente deve exercer esse direito em até 90 dias do
    registro da venda, caso contrário, presume-se a concordância com a manutenção da locação. Além disso,
    o locatário tem direito de preferência para adquirir o imóvel em igualdade de condições com terceiros.
  retrieved_source_ids:
