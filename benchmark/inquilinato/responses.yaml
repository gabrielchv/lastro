- sample_id: despesas-ordinarias
  refused: false
  answer: O locatário é obrigado a pagar as despesas ordinárias de condomínio, conforme o Art. 23, inciso
    XII, da Lei do Inquilinato. Estas despesas são as necessárias à administração do condomínio, como
    salários de empregados, consumo de água e luz das áreas comuns, e pequenos reparos. O locador poderá
    cobrar tais verbas juntamente com o aluguel do mês a que se refiram, se a responsabilidade for atribuída
    ao locatário. O locatário pode exigir a comprovação dessas despesas.
