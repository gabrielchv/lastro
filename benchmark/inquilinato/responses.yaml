- sample_id: morte-locatario
  refused: false
  answer: Morrendo o locatário, o contrato de locação é assumido por outras pessoas, dependendo da finalidade
    do imóvel. Em locações residenciais, sub-rogam-se nos direitos e obrigações o cônjuge sobrevivente
    ou companheiro, sucessivamente os herdeiros necessários e as pessoas que viviam na dependência econômica
    do falecido, desde que residentes no imóvel. Nas locações não residenciais, o espólio e, se for o
    caso, o sucessor no negócio assumem o contrato. A sub-rogação deve ser comunicada por escrito ao locador
    e ao fiador.
