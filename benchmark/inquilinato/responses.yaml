  - A sub-rogação deve ser comunicada por escrito ao locador.
  - A sub-rogação deve ser comunicada por escrito ao fiador.
- sample_id: crime-locacao
  refused: false
  answer: 'A Lei do Inquilinato considera crime a recusa do locador ou sublocador em fornecer recibo discriminado
    do aluguel e encargos em habitações coletivas multifamiliares. Também é crime o retomante não usar
    o imóvel para o fim declarado ou não o fazer pelo prazo mínimo de um ano, após a entrega.


    Constitui crime, ainda, o proprietário não iniciar a demolição ou reparação do imóvel dentro de sessenta
    dias contados de sua entrega, em casos específicos. Por fim, executar o despejo sem observar o disposto
    no § 2º do art. 65 também é considerado crime.'
  retrieved_source_ids:
  - '44'
  - '43'
  - '42'
  - '24'
  - '9'
  citations:
  - source_id: Art. 44
    quote: 'Constitui crime de ação pública, punível com detenção de três meses a um ano, que poderá ser
      substituída pela prestação de serviços à comunidade: I - recusar - se o locador ou sublocador, nas
      habitações coletivas multifamiliares, a fornecer recibo discriminado do aluguel e encargos;'
  - source_id: Art. 44
    quote: II - deixar o retomante, dentro de cento e oitenta dias após a entrega do imóvel, no caso do
      inciso III do art. 47, de usá - lo para o fim declarado ou, usando - o , não o fizer pelo prazo
      mínimo de um ano;
  - source_id: Art. 44
    quote: III - não iniciar o proprietário, promissário comprador ou promissário cessionário, nos casos
      do inciso IV do art. 9º, inciso IV do art. 47, inciso I do art. 52 e inciso II do art. 53, a demolição
      ou a reparação do imóvel, dentro de sessenta dias contados de sua entrega;
  - source_id: Art. 44
    quote: IV - executar o despejo com inobservância do disposto no § 2º do art. 65.
  claims:
  - A Lei do Inquilinato considera crime a recusa do locador ou sublocador em fornecer recibo discriminado
    do aluguel e encargos em habitações coletivas multifamiliares.
  - É crime o retomante não usar o imóvel para o fim declarado ou não o fazer pelo prazo mínimo de um
    ano, após a entrega.
  - Constitui crime o proprietário não iniciar a demolição ou reparação do imóvel dentro de sessenta dias
    contados de sua entrega, em casos específicos.
  - É crime executar o despejo sem observar o disposto no § 2º do art. 65.
