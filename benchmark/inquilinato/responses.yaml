  - A exploração do comércio deve ser por no mínimo três anos ininterruptos.
- sample_id: shopping-center
  refused: false
  answer: Nas locações de lojas em shopping center, prevalecem as condições livremente pactuadas nos contratos
    e as disposições procedimentais da Lei do Inquilinato. O empreendedor não pode cobrar do locatário
    despesas como obras de reforma estrutural, pintura de fachada, indenizações trabalhistas anteriores
    à locação, ou obras que modifiquem o projeto original e paisagismo de uso comum. As despesas cobradas
    devem ser previstas em orçamento, e o locatário pode exigir sua comprovação a cada sessenta dias.
    Adicionalmente, o locador em shopping center não pode recusar a renovação do contrato alegando que
    utilizará o imóvel para si ou para transferência de fundo de comércio próprio.
