  refused: false
  answer: 'Sim, o locatário poderá devolver o imóvel antes do prazo estipulado no contrato. Para isso,
    deverá pagar a multa pactuada, proporcional ao período de cumprimento do contrato, ou a que for judicialmente
    estipulada.


    Contudo, o locatário ficará dispensado da multa se a devolução do imóvel decorrer de transferência,
    pelo seu empregador, para prestar serviços em outra localidade. Nesse caso, é necessário notificar
    o locador por escrito com, no mínimo, trinta dias de antecedência.'
