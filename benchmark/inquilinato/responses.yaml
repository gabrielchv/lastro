- sample_id: garantia-unica
  refused: false
  answer: 'Não, o locador não pode exigir mais de uma modalidade de garantia no mesmo contrato de locação.


    O Art. 37, parágrafo único, da Lei do Inquilinato veda essa prática, sob pena de nulidade. Além disso,
    exigir mais de uma garantia constitui contravenção penal, conforme o Art. 43, inciso II.'
  retrieved_source_ids:
  - '37'
  - '49'
  - '43'
  - '38'
  - '40'
  citations:
  - source_id: Art. 37, Parágrafo único
    quote: É vedada, sob pena de nulidade, mais de uma das modalidades de garantia num mesmo contrato
      de locação.
  - source_id: Art. 43, inciso II
    quote: II - exigir, por motivo de locação ou sublocação, mais de uma modalidade de garantia num mesmo
      contrato de locação;
  claims:
  - O locador não pode exigir mais de uma modalidade de garantia no mesmo contrato de locação.
  - O Art. 37, parágrafo único, da Lei do Inquilinato veda essa prática.
  - A exigência de mais de uma garantia no mesmo contrato de locação acarreta a nulidade.
  - Exigir mais de uma garantia constitui contravenção penal.
  - Essa conduta está tipificada no Art. 43, inciso II, da Lei do Inquilinato.
- sample_id: obrigacoes-locatario
  refused: false
  answer: 'O locatário é obrigado a pagar pontualmente o aluguel e os encargos, usar o imóvel conforme
    o convencionado e restituí-lo no estado em que o recebeu, salvo deteriorações de uso normal. Deve
    também levar ao conhecimento do locador danos ou defeitos de sua responsabilidade e realizar reparos
    de danos causados por si ou seus dependentes.


    Além disso, não pode modificar o imóvel sem consentimento prévio e por escrito do locador, e deve
    pagar as despesas de consumo (água, luz, gás, telefone) e as despesas ordinárias de condomínio. O
    locatário também deve permitir a vistoria do imóvel mediante combinação prévia.'
  retrieved_source_ids:
  - '23'
  - '22'
  - '41'
  - '26'
  - '42'
  citations:
