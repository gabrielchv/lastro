  - O prazo para desocupação na liminar é de quinze dias.
  - A concessão da liminar está condicionada à prestação de caução.
  - A caução deve ser equivalente a três meses de aluguel.
  - A liminar é cabível em caso de descumprimento de mútuo acordo para desocupação.
  - A liminar é cabível no término de locação para temporada.
  - A liminar é cabível no término de locação não residencial.
  - Para locação para temporada ou não residencial, a ação de despejo deve ser proposta em até 30 dias
    do término do contrato.
  - A liminar é cabível em caso de rescisão do contrato de trabalho.
  - A liminar é cabível em caso de morte do locatário sem sucessor legítimo.
  - A liminar é cabível em caso de permanência de sublocatário após a extinção da locação principal.
  - A liminar é cabível em caso de necessidade de reparações urgentes no imóvel.
  - A liminar é cabível na falta de pagamento de aluguel e acessórios.
  - Para a falta de pagamento, a liminar é cabível quando o contrato de locação estiver desprovido de
    garantia.
  - A liminar é cabível no término do prazo notificatório para apresentação de nova garantia.
  - A liminar é cabível quando não há apresentação de nova garantia após o término do prazo notificatório.
