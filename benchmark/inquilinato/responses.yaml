  answer: 'Se o imóvel for vendido durante a locação, o adquirente poderá denunciar o contrato, concedendo
    ao locatário noventa dias para a desocupação. Contudo, essa denúncia não será possível se a locação
    for por tempo determinado, o contrato contiver cláusula de vigência em caso de alienação e estiver
    averbado junto à matrícula do imóvel.


