- sample_id: troca-fiador
  refused: false
  answer: O locador pode exigir a substituição do fiador em diversas situações, conforme o Art. 40 da
    Lei do Inquilinato. Isso inclui a morte, ausência, interdição, recuperação judicial, falência ou insolvência
    do fiador. Também é possível exigir a substituição se o fiador alienar ou gravar todos os seus bens
    imóveis, mudar de residência sem comunicar, ou se exonerar da fiança. Outros casos são a prorrogação
    da locação por prazo indeterminado com fiança ajustada por prazo certo, desaparecimento de bens móveis,
    desapropriação ou alienação do imóvel.
