- sample_id: contravencao-penal
  refused: false
  answer: 'Sim, cobrar antecipadamente o aluguel constitui contravenção penal, salvo nas hipóteses do
    Art. 42 e da locação para temporada. Essa infração é punível com prisão simples de cinco dias a seis
    meses ou multa de três a doze meses do valor do último aluguel atualizado.


    A cobrança antecipada é permitida se a locação não estiver garantida por qualquer modalidade, podendo
    o locador exigir o pagamento até o sexto dia útil do mês vincendo (Art. 42). Fora dessas exceções,
    o locador não poderá exigir o pagamento antecipado do aluguel.'
