  - source_id: Art. 23, III
    quote: restituir o imóvel, finda a locação, no estado em que o recebeu, salvo as deteriorações decorrentes
      do seu uso normal;
  - source_id: Art. 23, IV
    quote: levar imediatamente ao conhecimento do locador o surgimento de qualquer dano ou defeito cuja
      reparação a este incumba, bem como as eventuais turbações de terceiros;
  - source_id: Art. 23, V
    quote: realizar a imediata reparação dos danos verificados no imóvel, ou nas suas instalações, provocadas
      por si, seus dependentes, familiares, visitantes ou prepostos;
