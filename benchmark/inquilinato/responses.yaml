    atualizado.
  - A cobrança antecipada é permitida se a locação não estiver garantida por qualquer modalidade.
  - O locador pode exigir o pagamento até o sexto dia útil do mês vincendo, conforme o Art. 42.
  - Fora das exceções legais, o locador não pode exigir o pagamento antecipado do aluguel.
- sample_id: prazo-trinta-meses
  refused: false
  answer: Quando um contrato de locação é ajustado por escrito e por prazo igual ou superior a trinta
    meses, a resolução do contrato ocorre findo o prazo estipulado, independentemente de notificação.
    Se o locatário continuar na posse do imóvel por mais de trinta dias sem oposição do locador, a locação
    será presumida como prorrogada por prazo indeterminado. Nesse caso de prorrogação, o locador poderá
    denunciar o contrato a qualquer tempo, concedendo trinta dias para a desocupação.
