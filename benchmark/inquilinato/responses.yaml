- sample_id: separacao-casal
  refused: false
  answer: Em caso de divórcio, a locação residencial prosseguirá automaticamente com o cônjuge ou companheiro
    que permanecer no imóvel, conforme o Art. 12 da Lei do Inquilinato. Essa sub-rogação deve ser comunicada
    por escrito ao locador e ao fiador, se esta for a modalidade de garantia locatícia. O fiador poderá
    exonerar-se de suas responsabilidades no prazo de 30 dias contado do recebimento da comunicação, ficando
    responsável pelos efeitos da fiança durante 120 dias após a notificação ao locador.
