  - '12'
  - '11'
  - '3'
  - '4'
  - '10'
  citations:
  - source_id: Art. 12
    quote: Em casos de separação de fato, separação judicial, divórcio ou dissolução da união estável,
      a locação residencial prosseguirá automaticamente com o cônjuge ou companheiro que permanecer no
      imóvel.
  - source_id: Art. 12 § 1º
    quote: Nas hipóteses previstas neste artigo e no art. 11, a sub-rogação será comunicada por escrito
      ao locador e ao fiador, se esta for a modalidade de garantia locatícia.
  - source_id: Art. 12 § 2º
    quote: O fiador poderá exonerar-se das suas responsabilidades no prazo de 30 (trinta) dias contado
      do recebimento da comunicação oferecida pelo sub-rogado, ficando responsável pelos efeitos da fiança
      durante 120 (cento e vinte) dias após a notificação ao locador.
  claims:
  - Em caso de divórcio, a locação residencial prossegue automaticamente com o cônjuge ou companheiro
    que permanecer no imóvel.
  - Esta regra está prevista no Art. 12 da Lei do Inquilinato.
  - A sub-rogação da locação deve ser comunicada por escrito ao locador.
  - A sub-rogação da locação deve ser comunicada por escrito ao fiador, se a fiança for a modalidade de
    garantia locatícia.
  - O fiador poderá exonerar-se de suas responsabilidades.
  - O prazo para o fiador exonerar-se é de 30 dias.
  - O prazo de 30 dias para exoneração do fiador é contado do recebimento da comunicação.
  - O fiador permanece responsável pelos efeitos da fiança.
  - A responsabilidade do fiador perdura por 120 dias após a notificação ao locador.
