  - A cobrança antecipada do aluguel não constitui contravenção penal nas hipóteses do Art. 42.
  - A cobrança antecipada do aluguel não constitui contravenção penal na locação para temporada.
  - A infração de cobrança antecipada é punível com prisão simples de cinco dias a seis meses.
