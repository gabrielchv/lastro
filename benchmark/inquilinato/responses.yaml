- sample_id: despejo-liminar
  refused: false
  answer: 'Conceder-se-á liminar para desocupação em quinze dias, mediante caução equivalente a três meses
    de aluguel, em ações de despejo com fundamentos específicos. Isso inclui o descumprimento de mútuo
    acordo, o término de locação para temporada ou não residencial (se a ação for proposta em até 30 dias),
    e a rescisão do contrato de trabalho.


    Também é cabível em caso de morte do locatário sem sucessor legítimo, permanência de sublocatário
    após a extinção da locação, e necessidade de reparações urgentes no imóvel. A liminar pode ser concedida
    ainda na falta de pagamento de aluguel e acessórios quando o contrato estiver desprovido de garantia,
    ou no término do prazo notificatório sem apresentação de nova garantia.'
