      o pagamento do aluguel e encargos até o sexto dia útil do mês vincendo.
  - source_id: Art. 20
    quote: Salvo as hipóteses do art. 42 e da locação para temporada, o locador não poderá exigir o pagamento
      antecipado do aluguel.
  claims:
