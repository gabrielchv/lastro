    quote: pagar pontualmente o aluguel e os encargos da locação, legal ou contratualmente exigíveis,
      no prazo estipulado ou, em sua falta, até o sexto dia útil do mês seguinte ao vencido, no imóvel
      locado, quando outro local não tiver sido indicado no contrato;
  - source_id: Art. 23, II
    quote: servir - se do imóvel para o uso convencionado ou presumido, compatível com a natureza deste
