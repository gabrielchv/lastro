- sample_id: renovacao-comercial
  refused: false
  answer: Sim, um contrato de aluguel de imóvel destinado ao comércio pode ter direito à renovação. O
    locatário terá direito à renovação por igual prazo, desde que o contrato a renovar tenha sido celebrado
    por escrito e com prazo determinado. Além disso, o prazo mínimo do contrato ou a soma dos prazos ininterruptos
    dos contratos escritos deve ser de cinco anos, e o locatário deve estar explorando seu comércio, no
    mesmo ramo, por no mínimo três anos ininterruptos.
