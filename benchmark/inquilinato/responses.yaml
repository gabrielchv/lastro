      com finalidade residencial, o cônjuge sobrevivente ou o companheiro e, sucessivamente, os herdeiros
      necessários e as pessoas que viviam na dependência econômica do de cujus , desde que residentes
      no imóvel; II - nas locações com finalidade não residencial, o espólio e, se for o caso, seu sucessor
      no negócio.'
