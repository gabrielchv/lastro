- sample_id: prazo-inferior
  refused: false
  answer: 'Se o contrato de aluguel for ajustado verbalmente ou por escrito com prazo inferior a trinta
    meses, findo o prazo estabelecido, a locação prorroga-se automaticamente por prazo indeterminado.


    Nesse caso, o imóvel somente poderá ser retomado nas hipóteses previstas nos incisos do Art. 47 da
    Lei do Inquilinato. Isso inclui, por exemplo, pedido para uso próprio, demolição e edificação licenciada,
    ou se a vigência ininterrupta da locação ultrapassar cinco anos.'
