# PT-BR grounded-generation benchmark over Lei 8.245/1991 (Lei do Inquilinato).
#
# `expected_source_ids` is the article that must ground a correct answer, checked
# against the statute text in sources.yaml rather than assumed. An empty list means
# the correct behaviour is refusal: the question is outside what this corpus can
# support, and answering it at all is the failure.
#
# Cases 1-17 are inherited from inquilino-ia's own eval set. The rest extend
# coverage into procedural and commercial-tenancy articles, and add the
# out-of-scope traps that make over-refusal measurable in both directions.

